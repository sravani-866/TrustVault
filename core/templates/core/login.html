
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustVault - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #101a35, #243b68);
        }

        .login-box {
            width: 360px;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #172b4d;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 7px;
            background: #2456a6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #173d7a;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>TrustVault</h1>
        <p class="subtitle">Secure Document Management</p>

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter password" required>

            <button type="submit">Login</button>
        </form>

        <p class="footer">Your documents. Your control. Your security.</p>
    </div>
</body>
</html>
